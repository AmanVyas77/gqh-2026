# equity_pairs/config.yaml - FROZEN FIRST SPECIFICATION (Prompt 1, 2026-10-03)
# These are pre-registered research choices, not proven-optimal settings. There are
# no competing algorithms and no parameter searches.
# HYPOTHESIS.md (operational section) explains the choices. Its machine-checked
# `spec-check` block must agree with this file. Any substantive conflict fails
# closed: guard.py and the pilot refuse to run until the two are reconciled.
# Any change after the Prompt 1 snapshot is an amendment: take a new dated, hashed
# snapshot and add a research_log.csv row. tests/test_config_consistency.py fails
# if this file's SHA-256 does not appear in research_log.csv.

project:
  name: equity_pairs
  stage: prompt_2_sources_frozen
  config_status: frozen_prompt1_amended
  frozen_at_utc: "2026-10-04T02:01:35Z"
  snapshot_dir: snapshots/2026-10-03_prompt1_preregistration   # original; preserved unchanged
  amendments:
    - {snapshot: snapshots/2026-10-03_prompt1_corrections, what: "exact holdout split (no month snap); MOC liquidation convention; pooled-summary and attribution wording; fail-closed spec consistency"}
  spec_consistency: "fail closed: guard.py and pipelines raise while HYPOTHESIS.md spec-check conflicts with this file"
  representation_change:
    date: "2026-10-03"
    from: "direct clustering of stocks' formation-window daily return series (original brief)"
    to: "clustering of stocks' 5-component PCA loading coordinates"
    tested: false            # neither representation has been tested on any data

deadline:
  submission: "2026-10-04T11:00:00-04:00"   # Sunday, America/New_York (EDT)
  timezone: America/New_York
  research_note_max_pages: 5
  reproducible_code: true

# ---------------------------------------------------------------- A. history / holdout
timeline:
  session_calendar: XNYS                 # exchange_calendars holiday rules; no prices used
  target_data_start: "2015-01-01"        # first session on/after this date
  as_of_date: "2026-10-03"               # evaluation_end = last session strictly before this date
  reform_frequency: monthly
  formation_price_obs: 127               # consecutive price observations
  formation_return_obs: 126              # daily returns per formation window
  warmup_rule: "first formation end = first month-end session with >= 127 sessions from the data start"
  min_development_months: 36
  boundary_status: frozen                # unresolved | provisional | frozen; loaders refuse unless frozen
  boundary_frozen_at_utc: "2026-10-04T02:13:35Z"      # Prompt 2, before any price request; data start 2015-01-02 kept (source history predates it; pilot fetch verifies)
  boundary_resolution: >-
    Prompt 2 confirms the data start from source metadata (no prices), recomputes
    with split.py, sets boundary_status to frozen via a logged amendment and a new
    snapshot, and only then requests prices. A later data start can only move the
    boundary later, so 2024-10-03 is the earliest possible holdout start.
  # Provisional values below are computed by split.py from the XNYS calendar.
  session_convention: "XNYS sessions identified by New York calendar date"
  evaluation_window: "sessions strictly after first_formation_end through evaluation_end (inclusive)"
  first_formation_end: "2015-07-31"
  evaluation_start: "2015-08-03"
  evaluation_end: "2026-10-02"
  n_evaluation_sessions: 2809
  holdout:
    fraction: 0.20
    fraction_rounding: ceil
    max_calendar_years: 2
    years_rule: "evaluation sessions in the half-open window (evaluation_end - 2 calendar years, evaluation_end]"
    size_rule: "holdout = exactly the last H evaluation sessions, H = min(ceil(0.20 * n_evaluation_sessions), sessions in the 2-year window)"
    month_snap: none                     # monthly formation never lengthens the holdout
    bounds: "[start, end], both inclusive"
    sessions_fraction_rule: 562
    sessions_years_rule: 501
    binding_rule: years
    start: "2024-10-03"
    end: "2026-10-02"
    n_sessions: 501
    starts_flat: true
  development:
    bounds: "[start, end], both inclusive; end = session immediately before holdout.start"
    start: "2015-08-03"
    end: "2024-10-02"
    n_sessions: 2308
    n_months: 111                          # calendar months containing development sessions; 2024-10 is a 2-session stub
    positions_close_before_boundary: true  # predetermined MOC liquidation at the 2024-10-02 close
  trading_windows: >-
    calendar months intersected with each segment, so the boundary splits October 2024
    into a development stub (2024-10-01..02) and a holdout stub (2024-10-03..31). Each
    window's formation ends at the session immediately before the window's first session
    (normally the prior month end; 2024-10-02 for the holdout stub).
  inheritance: none                        # no other project's cutoff is used

# ---------------------------------------------------------------- B. universe
universe:
  index: "S&P 500"
  membership_preference: point_in_time_including_former_members_with_price_histories
  membership_fallback: dated_current_constituent_snapshot   # explicitly survivorship-biased exploratory experiment
  membership_source: "Wikipedia 'Historical components of the S&P 500' revid 1376064088 (changes table, 409 rows, 1976-07-01..2026-09-21) + 'List of S&P 500 companies' revid 1376729338 (503 current constituents)"
  membership_method: "members at formation end = current list with every change dated after the formation end reversed (remove added ticker, restore removed ticker)"
  membership_basis: point_in_time_reconstructed   # survivorship-biased wherever former members lack Yahoo price history
  membership_snapshot_date: "2026-10-04T02:12:13Z"  # retrieval time of the pinned revisions
  membership_test: "index member as of the formation-end session"
  identifiers:
    permanent_id: none_available          # no free permanent security id; Yahoo ticker used (symbol fallback)
    permanent_id_fallback: "ticker as of formation end; symbol fallback is logged"
    issuer_id: "SEC CIK for current members; normalized security name (class/share words removed) for former members"
    issuer_id_fallback: "manual dual-class issuer map written from the constituent list before any price download"
  eligibility:                            # formation-time information only
    complete_price_obs: 127
    positive_prices: true
    min_return_std: 1.0e-12               # nonzero variance of the 126 formation returns
    min_formation_end_raw_close: 5.0
    min_median_dollar_volume: 20000000    # median over the 127 formation sessions of raw close x raw volume
    stale_price:                          # defined before observing any prices
      max_zero_or_missing_volume_sessions: 0
      max_identical_close_run: 4          # exclude if >= 5 consecutive sessions share an identical raw close
      max_zero_return_share: 0.10         # exclude if > 10% of the 126 returns are exactly zero
    exclude_same_issuer_pairs: true
    uses_future_information: false        # never filter on later survival or later data completeness
  sector_label_vintage: modern            # current GICS from Wikipedia; former members have no label and get no sector-arm candidates

data:
  price_source: "Yahoo Finance via yfinance 1.7.0: Ticker.history(start, end, auto_adjust=False, actions=True, repair=False); end exclusive (validated by probe)"
  source_conventions:                     # frozen before any price request
    close: "split-adjusted, NOT as-traded"
    adj_close: "split- and dividend-adjusted (Yahoo multiplicative dividend factor)"
    volume: "split-adjusted"
    returns: "Adj Close ratios; deviates from data.return_formula (raw prices unavailable); difference is second order on ex-dates"
    formation_price_index: "Adj Close / Adj Close at the first formation session"
    dollar_volume: "Close x Volume (both split-adjusted) = as-traded dollar volume up to rounding"
    min_price_filter: "applied to split-adjusted Close: CONFLICT with the raw-close rule (stricter for later forward splits; embeds future split events)"
    raw_reconstruction: none              # not attempted: would need post-window (incl. holdout) split history
    former_member_identity: "exclude a former-member ticker if Yahoo firstTradeDate is after its window start or its Yahoo name shares no token (len>=3, minus corp/inc/company/the/group/holdings/class/ltd/plc/co) with the Wikipedia security name"
    missing_prices: "no fill: any missing session in a window excludes the stock (complete_price_obs)"
    bh_family: "union candidates with a finite p-value; numerically degenerate pairs are rejected before BH"
  pilot_download: {first_date: "2015-01-30", last_date: "2016-06-30", request_end_exclusive: "2016-07-01"}
  required_fields: [raw_open, raw_close, raw_volume, split_ratio, cash_dividend, sector, index_membership]
  raw_price_convention: >-
    as-traded prices. If the source supplies split-adjusted prices, reconstruct raw
    prices with the source's split ledger and log the convention.
  return_formula: "r_t = k_t * (P_t + D_t) / P_{t-1} - 1 (P raw close; k_t split ratio effective at ex-date t, else 1; D_t cash dividend per post-split share with ex-date t)"
  formation_price_index: "TR_t = cumulative product of (1 + r) from 1.0 at the first formation session; window-local, no later adjustments"
  sector_source: "Wikipedia 'List of S&P 500 companies' revid 1376729338, GICS Sector (modern labels)"
  raw_dir: data/raw
  max_download_date: "2024-10-02"         # = development.end (inclusive); guard.py refuses everything until the boundary is frozen

# ---------------------------------------------------------------- C. PCA + clustering
features:
  returns: daily_simple_total_return
  matrix: "R: T x N, rows = 126 formation return sessions, columns = eligible stocks sorted by permanent id"
  standardize: "per column (stock): subtract window mean, divide by window sample std (ddof=1); this window only"
  pca:
    method: svd
    svd_input: "Z / sqrt(T - 1) = U S V^T; S^2 = eigenvalues of the N x N return correlation matrix"
    n_components: 5
    loadings: "L[i, k] = V[i, k] * sqrt(lambda_k) = V[i, k] * S[k]; V is N x K, one row per stock"
    sign_convention: "flip each component so its largest-|V| entry is positive (distance-invariant; reproducibility only)"
    whitening: false
    shrinkage: false
    market_factor_removal: false
    explained_variance_tuning: false
  representation: "row i of L scaled to unit Euclidean norm"
  zero_vector_tolerance: 1.0e-10          # exclude stocks whose 5-vector norm is below this

clustering:
  objects: stocks                         # rows of the N x 5 loading matrix; never sessions
  distance: euclidean                     # on unit-norm vectors: d = sqrt(2 - 2 cos(theta))
  linkage: average
  cut_distance: 0.7
  criterion: distance
  implementation: "scipy.cluster.hierarchy.linkage(method='average', metric='euclidean') + fcluster(t=0.7, criterion='distance')"
  ordering: "stocks sorted by permanent identifier before fitting"
  singleton_clusters: no_candidates

# ---------------------------------------------------------------- D. candidates / baselines
candidates:
  neighbors_per_stock: 3
  arms:
    pca_cluster:
      scope: same_cluster
      rank_by: "Euclidean distance between unit-norm PCA loading vectors, ascending"
    correlation:
      scope: all_eligible
      rank_by: "Pearson correlation of formation daily returns, descending"
    sector:
      scope: same_sector
      rank_by: "Pearson correlation of formation daily returns, descending"
  same_issuer: "excluded before ranking"
  fewer_than_k_available: take_all_available
  ties: "permanent identifier ascending"
  canonical_pair: "(lower permanent id, higher permanent id); deduplicated within each arm"
  overlap_report: [candidates_prescreen, passing_pairs, selected_pairs]
  overlap_metrics: [share_of_pca_in_correlation, share_of_pca_in_sector, jaccard]

# ---------------------------------------------------------------- E. spread screening (all arms)
screening:
  orientation: "leg A = lower permanent id (dependent), leg B = higher; symbol fallback logged"
  regression: "log TR_A = alpha + beta * log TR_B + e; OLS on the 127 formation prices only"
  cointegration_test:
    method: augmented_engle_granger
    implementation: statsmodels.tsa.stattools.coint
    trend: c
    maxlag: 5
    autolag: aic
  multiple_testing:
    method: benjamini_hochberg
    q: 0.05
    family: "deduplicated union of candidate pairs across all three arms, per formation"
    caveat: "screening heuristic, not guaranteed FDR control: pairs are dependent and candidates are chosen on the same observations"
  pass_rules:
    max_bh_adjusted_p: 0.05
    beta_min: 0.25
    beta_max: 4.0
    min_residual_std: 1.0e-8              # and finite
    half_life:
      model: "e_t = c + phi * e_{t-1} + u_t, OLS on formation residuals"
      phi_bounds_exclusive: [0.0, 1.0]
      formula: "-log(2) / log(phi)"
      min_sessions: 2
      max_sessions: 20
  degeneracy_rejects:
    - non_finite_input_or_output
    - zero_variance_log_tr_b
    - ols_design_condition_number_above_1e8
    - cointegration_test_error_or_nan_pvalue

# ---------------------------------------------------------------- F. portfolio / trading (not built yet)
portfolio:
  selection: "rank passing pairs by formation return correlation (desc), ties by (id_A, id_B); add greedily, skipping pairs that share a stock with a selected pair"
  max_pairs: 10
  shared_stocks: false
  per_pair_gross_max_nav: 0.10
  total_gross_max_nav: 1.00
  unused_allocation: cash
  return_base: total_nav

trading:
  frozen_from_formation: [alpha, beta, spread_mean, spread_std]
  spread: "s_t = log TR_A,t - alpha - beta * log TR_B,t (TR extended past formation with realized total returns)"
  spread_std_ddof: 1
  zscore: "(s_t - spread_mean) / spread_std"
  entry_abs_z: 2.0
  exit_abs_z: 0.5
  stop_abs_z: 4.0
  max_holding_sessions: 20
  entry_band: "entry_abs_z <= |z| < stop_abs_z, only when flat"
  direction: "z >= +2: short spread (short A, long B); z <= -2: long spread (long A, short B)"
  signal_time: close
  fill_time: next_session_open            # raw open; no fill-time re-check of z
  trading_window: "see timeline.trading_windows"
  signal_sessions: "closes of sessions 1..K-1 of the trading window; signals at the session-K close are ignored"
  signal_execution: "every signal-driven entry, exit, stop, or time exit fills at the next session's raw open; no signal fills at the close it was computed from"
  scheduled_liquidation: >-
    predetermined market-on-close orders on each trading window's last session,
    fixed by the calendar before the window starts and independent of any signal;
    modeled at that session's closing price plus transaction costs
  close_price_caveat: "historical closing prices are execution proxies, not guaranteed MOC fills"
  development_end_liquidation: "predetermined MOC liquidation at the 2024-10-02 close; no position enters the holdout"
  conventions_identical_across_arms: true
  precedence: [stop, convergence_exit, time_exit]
  holding_count: "the entry-fill session counts as 1; time exit is signalled at the close where the count reaches 20"
  re_entry_after_stop: "none in that pair for the rest of the trading month"
  re_entry_after_other_exit: "allowed from the first close after the exit fill"
  sizing:
    gross_per_pair: "0.10 x NAV at the signal close"
    dollar_weights: "long spread: +G/(1+beta) in A, -G*beta/(1+beta) in B; short spread: signs reversed"
    rationale: "value change ~ G/(1+beta) * (dlog A - beta * dlog B) = G/(1+beta) * d(spread)"
    shares: "fractional; fixed from entry to exit (no rebalancing)"
  exposures_measured: [net_dollar_over_nav, gross_over_nav, ex_ante_market_beta, net_sector_dollar_over_nav]
  neutrality_asserted: false
  delisting_rule: "if a leg stops trading, close both legs at that session's last available raw close; no delisting return unless the source provides one (disclosed)"
  corporate_actions_ledger: "splits rescale share counts on the ex-date; cash dividends are credited to longs and debited to shorts on the ex-date"
  execution_prices: raw

costs:                                    # assumptions; no historical cost or borrow evidence is used
  transaction_bps_per_traded_dollar_per_leg: 10   # combined commission + spread + slippage
  short_borrow_annual_rate: 0.03          # on prior-close short market value, accrued per session / 252
  borrow_availability: "assumed always available; no recalls (assumption)"
  stress_multiplier: 2.0                  # doubles both the transaction cost and the borrow rate
  funding: "NAV = cash + long MV - short MV; short proceeds credited to cash; cash and negative cash both at 0%; borrow, costs, and dividends settle in cash"
  cash_rate: 0.0
  taxes: ignored
  initial_nav: 1.0

# ---------------------------------------------------------------- Prompt 2 feasibility gate
pilot:
  scope: formation_diagnostics_only        # no subsequent returns, P&L, Sharpe, or equity curves
  formations: "earliest 12 consecutive eligible development month-end formations after warmup"
  provisional_formation_ends: ["2015-07-31", "2015-08-31", "2015-09-30", "2015-10-30", "2015-11-30", "2015-12-31",
                               "2016-01-29", "2016-02-29", "2016-03-31", "2016-04-29", "2016-05-31", "2016-06-30"]
  timebox_minutes: 45
  source_discovery_timebox_minutes: 15
  diagnostics: [n_eligible, exclusion_counts_by_rule, n_clusters, cluster_size_distribution, n_zero_vector_exclusions,
                candidates_per_arm, overlap_metrics, n_tested_union, n_passing_per_arm, rejection_counts_by_rule,
                n_selected_non_overlapping_pairs_per_arm]
  thresholds:
    n_formations: 12
    min_eligible_stocks: 300
    max_formations_below_min_eligible: 6   # BLOCKED if more than 6 formations have < 300 eligible
    min_pca_pairs: 5                        # eligible non-overlapping selected pairs in the PCA arm
    min_formations_with_min_pca_pairs: 6    # NOT PROMISING if fewer than 6 of 12 formations reach it
    redundancy_overlap_share: 0.90          # flag if share_of_pca_in_correlation > 0.90 ...
    redundancy_min_formations: 6            # ... in at least 6 formations (a flag, not a verdict)
  verdicts:
    BLOCKED: "insufficient history, < 12 formations, < 300 eligible stocks in > 6 formations, unusable data conventions, inadequate holdout protection, or an incomplete required audit/pilot at timebox expiry"
    NOT_PROMISING: "usable inputs, but the PCA arm has >= 5 eligible non-overlapping pairs in fewer than 6 of 12 formations"
    PASS_WITH_LIMITATIONS: "data and breadth gates pass, but universe, delisting, sector, or borrow assumptions limit the claims"
    PASS: "data and breadth gates pass with historical coverage adequate for the stated scope"
  note: "practical feasibility thresholds, not statistical validation; never relaxed after results; a pass is not evidence of profitability or incremental ML value"

# ---------------------------------------------------------------- later validation (defined; not run in Prompt 2)
validation:
  confirmatory_sample: holdout
  pooled_summary: "full walk-forward (development + holdout) is a descriptive pooled summary only, not a second independent confirmation of the holdout"
  monthly_return: "compounded daily net NAV return within each calendar month"
  q1_convergence:
    unit: "each executed entry in an arm's selected pairs"
    statistic: "D10 = |z| at min(signal close + 10 sessions, trading-month last session) minus |z| at the signal close"
    null: "E[D10] >= 0 (a random-walk spread makes |z| a submartingale)"
    alternative: "E[D10] < 0"
    test: "one-sided t-test, standard errors clustered by trading month"
    alpha: 0.05
    sesoi_z: 0.25
    against_if: "point estimate >= 0 and 95% CI lower bound > -0.25"
    secondary: [share_reaching_exit_band, share_stopped, share_time_exited, median_sessions_to_exit, share_selected_pairs_crossing_mean_in_month]
    primary_arm: pca_cluster
  q2_selection:
    statistic: "d_m = PCA-arm monthly net NAV return minus baseline monthly net NAV return"
    baselines: [correlation, sector]
    null: "E[d_m] <= 0, for each baseline"
    test: "one-sided Newey-West HAC t-test, Bartlett kernel, 3 lags"
    alpha: 0.05
    multiplicity: "Holm across the two baselines for per-baseline claims; intersection-union (both one-sided p <= 0.05) for 'improves on both'"
    sesoi_monthly: 0.0010
    ci: "95% stationary block bootstrap, mean block 3 months, 10000 resamples, seed 20261003"
    supported_if: "Holm-adjusted p <= 0.05"
    no_meaningful_improvement_if: "95% CI upper bound < 0.0010"
    otherwise: inconclusive
    power_report: "MDE = (1.645 + 0.842) * sd(d_m) / sqrt(n_months), reported alongside every result"
  q3_economic:
    null: "E[PCA-arm monthly net NAV return] <= 0"
    test: "one-sided Newey-West HAC t-test, 3 lags"
    alpha: 0.05
    cost_stress: "mean monthly net return under stress_multiplier costs must be > 0 (point estimate, CI reported) to support economic robustness"
    attribution:
      role: "limited exposure diagnostics; cannot show returns are unexplained by standard asset-pricing factors, nor prove the liquidity-provision mechanism"
      frequency: daily
      model_market: "r_t = a + b * MKT_t + e_t; MKT = equal-weighted eligible-universe return"
      model_sector: "r_t = a + sum_s b_s * SEC_s,t + e_t; SEC_s = equal-weighted eligible return of sector s"
      hac_lags: 5
      predominantly_factor_explained_if: "sector-model R^2 >= 0.50, or (mean net return > 0 and fitted factor component >= 50% of it)"
    concentration:                         # applies when total net P&L P > 0; all must hold
      max_best_month_share: 0.25
      positive_after_removing_best_months: 3
      positive_after_removing_top_pair_episodes: 10   # pair x trading month
      max_single_pair_share: 0.20
      max_calendar_year_share: 0.50        # full-period sample only (>= 5 calendar years)
  supporting_metrics: [annualized_sharpe_monthly, annualized_sharpe_daily, max_drawdown, annual_turnover,
                       mean_gross_exposure, n_trades, exposures, concentration]
  outcomes: [supported, evidence_against, inconclusive]
  inconclusive_note: "insufficient evidence is inconclusive, not proof that the economic mechanism is false"

robustness:
  rule: "each variant changes exactly one parameter from the primary specification; all three arms are rerun"
  variants:
    - {name: pca_components_4, path: features.pca.n_components, value: 4}
    - {name: pca_components_6, path: features.pca.n_components, value: 6}
    - {name: entry_z_1p8, path: trading.entry_abs_z, value: 1.8}
    - {name: entry_z_2p2, path: trading.entry_abs_z, value: 2.2}
  stable_if: "in >= 3 of 4 variants: PCA-arm mean monthly net return > 0, and the PCA-minus-baseline mean difference has the primary's sign for both baselines"
  selection_rule: "never choose the final strategy by the best robustness result"

evaluation:
  variants_run_on_real_data: 0

synthetic:
  allowed_for: implementation_checks_only
  seed: 20261003
